services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pet_vaccination}
      POSTGRES_USER: ${POSTGRES_USER:-pet_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pet_app}

    ports:
      - "${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pet_vaccination}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pet_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pet_app}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      SPRING_JPA_OPEN_IN_VIEW: "false"

    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
